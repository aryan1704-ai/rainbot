<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | RainBot</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    .auth-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(145deg, #f4f4f4, #e0e0e0);
      padding: 30px 15px;
    }
    .auth-box {
      background-color: white;
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .auth-box h2 {
      margin-bottom: 25px;
      color: #333;
    }
    .social-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      padding: 12px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      background-color: #fff;
      transition: all 0.2s ease;
    }
    .social-btn:hover {
      background-color: #f0f0f0;
    }
    .social-btn i {
      font-size: 20px;
      color: #333;
    }
    .divider {
      text-align: center;
      margin: 20px 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: "";
      position: absolute;
      width: 40%;
      height: 1px;
      background: #ccc;
      top: 50%;
    }
    .divider::before {
      left: 0;
    }
    .divider::after {
      right: 0;
    }
    .divider span {
      background: white;
      padding: 0 12px;
      color: #666;
    }
    form input {
      width: 100%;
      margin-bottom: 15px;
      padding: 10px 2px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .auth-submit {
      background-color: #32aa27;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .links{
        display: flex;
        font-size: 20px;
        text-decoration: none;
        padding-top: 20px;
        
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-box">
      <h2>LOGIN</h2>
      <form>
        <input type="email" placeholder="Email address" required>
        <input type="password" placeholder="Password" required>
        <button class="auth-submit" type="submit">LOGIN</button>
        <a class="links" href="">Register</a>
      </form>
    </div>
  </div>

<!-- Code injected by live-server -->

</body>
</html>
